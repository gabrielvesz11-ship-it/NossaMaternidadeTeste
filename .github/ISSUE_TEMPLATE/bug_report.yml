name: Bug report
description: Report a reproducible bug in the canonical Nossa Maternidade app.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps.
      placeholder: |
        1. Open...
        2. Tap...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / simulator
      placeholder: iPhone 16 simulator, iOS 18.x
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Do not include secrets, tokens, API keys, or private user data.
