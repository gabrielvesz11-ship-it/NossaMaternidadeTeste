name: Feature request
description: Propose product work for the canonical Nossa Maternidade app.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the intended behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Given...
        - When...
        - Then...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Onboarding
        - Home
        - Tracker
        - Journal
        - NathIA
        - Paywall
        - Backend/Supabase
        - Other
    validations:
      required: true
